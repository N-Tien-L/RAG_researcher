# Grafana Datasources Configuration
apiVersion: 1

datasources:
  # Prometheus - Metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      # Enable exemplars for trace correlation

      timeInterval: 15s
    version: 1

  # Tempo - Distributed Tracing


  # Loki - Logs
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    editable: false
    jsonData:
      httpMethod: GET
      maxLines: 1000
      # Enable derived fields for trace correlation

    version: 1
