services:
  rag-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-app-1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - venv_data:/app/.venv
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      TEI_URL: http://host.docker.internal:8080
      OLLAMA_URL: http://ollama:11434
      LLM_TIMEOUT: "180"
      # Set to "kaggle" to use the Kaggle LitServe endpoint instead of Ollama
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      KAGGLE_LLM_URL: ${KAGGLE_LLM_URL:-}
      KAGGLE_LLM_API_KEY: ${KAGGLE_LLM_API_KEY:-}
      KAGGLE_LLM_MAX_TOKENS: ${KAGGLE_LLM_MAX_TOKENS:-1024}
      KAGGLE_LLM_TEMPERATURE: ${KAGGLE_LLM_TEMPERATURE:-0.2}
      CHAT_HISTORY_MAX_TURNS: ${CHAT_HISTORY_MAX_TURNS:-10}
      ENABLE_METRICS: "true"
      ENABLE_TRACING: "false"
      LOKI_ENDPOINT: http://loki:3100
      LOKI_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - postgres

  postgres:
    container_name: postgres_container
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: my_rag_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postgres

  redis:
    container_name: redis_container
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    networks:
      - postgres



  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - postgres

  loki:
    image: grafana/loki:latest
    container_name: loki_container
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_container
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    networks:
      - postgres

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_container
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    depends_on:
      - prometheus
      - loki
    networks:
      - postgres

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
  venv_data:
  ollama_data:

networks:
  postgres:
    driver: bridge