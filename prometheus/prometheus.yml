# Prometheus Configuration for RAG Researcher
global:
  scrape_interval: 15s      # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'rag-researcher'
    environment: 'development'

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Scrape FastAPI application metrics
  - job_name: 'rag-app'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rag-app:8000']
        labels:
          service: 'rag-researcher'
          component: 'api'
    # Enable exemplar support for trace correlation
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.*'
        action: keep
